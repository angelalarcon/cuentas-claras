name: Supabase keep-alive

# Supabase pauses free-tier projects after a week without activity, so this
# hits the database every 3 days with a tiny read to keep it awake.
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          # same public anon key the static page ships with in index.html
          SUPABASE_URL: https://fjhwnypedexgnbkthrtt.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqaHdueXBlZGV4Z25ia3RocnR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMDUxMDAsImV4cCI6MjA5ODU4MTEwMH0.LBwYCefYXmfynB9SR2nUlJLdaJ4WcmWDmftluzSaQng
        run: |
          curl --fail-with-body -sS \
            "$SUPABASE_URL/rest/v1/records?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
